{% extends "layout.html" %}
{% block main %}

<main>
    <div class="container py-4">
        <form action="/story-input" method="post">
            <p class="h4">Story Input</p>

            <div class="row mb-3">
                <label for="title" class="col-md-3">Title</label>
                <div class="col-md-9">
                    <input name="title" type="text" class="form-control" value="{{ data.title or '' }}" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="story_id" class="col-md-3">Story ID</label>
                <div class="col-md-9">
                    <input name="story_id" type="text" class="form-control" value="{{ data.story_id or '' }}"
                        placeholder="Optional; generated from title if blank">
                </div>
            </div>

            <div class="row mb-3">
                <label for="subreddit" class="col-md-3">Subreddit</label>
                <div class="col-md-9">
                    <input name="subreddit" type="text" class="form-control" value="{{ data.subreddit or 'local' }}">
                </div>
            </div>

            <div class="row mb-3">
                <label for="max_chars_per_video" class="col-md-3">Max Characters Per Video</label>
                <div class="col-md-9">
                    <input name="max_chars_per_video" type="number" min="1" step="1" class="form-control"
                        value="{{ data.max_chars_per_video or '' }}" placeholder="Blank uses storymode_max_length from config">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-md-3">Options</label>
                <div class="col-md-9">
                    <div class="form-check form-switch">
                        <input name="split_updates" class="form-check-input" type="checkbox" value="true"
                            {% if data.split_updates %}checked{% endif %}>
                        <label class="form-check-label" for="split_updates">Split headings like ## Update 1 into separate videos</label>
                    </div>
                    <div class="form-check form-switch">
                        <input name="nsfw" class="form-check-input" type="checkbox" value="true"
                            {% if data.nsfw %}checked{% endif %}>
                        <label class="form-check-label" for="nsfw">NSFW</label>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="story" class="col-md-3">Story</label>
                <div class="col-md-9">
                    <textarea name="story" class="form-control" rows="22" required>{{ data.story or '' }}</textarea>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">Save To Inbox</button>
            </div>
        </form>
    </div>
</main>

{% endblock %}
